# Marketing Agent Configuration

name: marketing
description: Social media, content generation, and campaign planning
schedule: "on-demand"  # Options: daily, weekly, on-demand

# Content platforms
platforms:
  - nostr
  - twitter
  - blog  # via nostria-website

# Output
output_dir: "marketing"
content_types:
  - social-posts
  - blog-drafts
  - announcements
  - threads

# Mention scanning
mention_scanner:
  script: "scripts/marketing/nostr-mention-scanner.ts"
  relay_config: "scripts/marketing/relays.json"
  output_dir: "marketing/mentions"
  schedule: "weekly"
  default_since_days: 30
  nostria_npub: "npub16x7nxvehx0wvgy0sa6ynkw9c2ghuph3z0ll5t8veq3xwm8n9tqds6ka44x"

# Behavior
tone: "friendly, enthusiastic, technical but accessible"
max_post_length: 280  # for Twitter-style posts
auto_publish: false  # always require human review before posting
