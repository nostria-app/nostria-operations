# GitHub Actions: Cross-Repo Website Update
# Allows agents to open PRs in nostria-website from this repo.
# Triggered manually with content parameters.

name: Update Website Content

on:
  workflow_dispatch:
    inputs:
      file_path:
        description: 'Path in nostria-website to create/update (e.g., blog/2026-02-new-feature.md)'
        required: true
        type: string
      content_source:
        description: 'Path in nostria-operations containing the content to push'
        required: true
        type: string
      pr_title:
        description: 'Title for the PR'
        required: true
        type: string
      pr_body:
        description: 'Body/description for the PR'
        required: false
        default: 'Automatically generated by Nostria Operations agent.'
        type: string

permissions:
  contents: read

jobs:
  update-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nostria-operations
        uses: actions/checkout@v4
        with:
          path: operations

      - name: Checkout nostria-website
        uses: actions/checkout@v4
        with:
          repository: nostria-app/nostria-website
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          path: website

      - name: Copy content and create PR
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          BRANCH="agent/content/$(date +%Y%m%d-%H%M%S)"

          cd website
          git checkout -b "$BRANCH"

          # Ensure target directory exists
          mkdir -p "$(dirname "${{ inputs.file_path }}")"

          # Copy content from operations repo
          cp "../operations/${{ inputs.content_source }}" "${{ inputs.file_path }}"

          git add .
          git commit -m "${{ inputs.pr_title }}"
          git push origin "$BRANCH"

          gh pr create \
            --repo nostria-app/nostria-website \
            --title "${{ inputs.pr_title }}" \
            --body "${{ inputs.pr_body }}" \
            --base main \
            --head "$BRANCH"
